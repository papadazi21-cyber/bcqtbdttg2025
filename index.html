                {authSession.role === 'admin' && !selectedUnit && viewMode === 'entry' ? (
                  <div className="flex-1 flex flex-col gap-6 max-w-7xl mx-auto w-full animate-in overflow-y-auto custom-scrollbar pr-2">
                    <div className="bg-white p-6 rounded-[2.5rem] border shadow-sm flex items-center justify-between gap-4 sticky top-0 z-[150]">
                       <div className="flex items-center gap-6">
                          <div className="flex flex-col">
                            <span className="text-slate-400 font-black uppercase text-[9px] tracking-widest">Tiến độ nộp báo cáo</span>
                            <span className="text-xl font-black text-indigo-950 uppercase">{Object.keys(allUnitsData).length} / {UNITS.length} đơn vị</span>
                          </div>
                          <div className="relative group">
                            <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size={16} />
                            <input type="text" placeholder="Tìm tên đơn vị..." value={searchUnit} onChange={(e) => setSearchUnit(e.target.value)} className="bg-slate-50 border-none rounded-2xl py-3 pl-12 pr-6 font-bold text-slate-700 w-80 shadow-inner focus:ring-2 focus:ring-indigo-500 outline-none" />
                          </div>
                       </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 pb-10">
                      {sortedUnits.map(u => (
                        <div key={u} className="bg-white border rounded-[2.2rem] p-5 shadow-sm hover:shadow-xl transition-all flex flex-col gap-4">
                          <h3 className="font-black text-slate-800 uppercase leading-tight text-[12px] h-[3rem] line-clamp-2">{u}</h3>
                          <button onClick={() => setSelectedUnit(u)} className="w-full bg-slate-950 text-white font-black py-2.5 rounded-xl text-[9px] uppercase hover:bg-indigo-600 transition-all flex items-center justify-center gap-1 shadow-lg active:scale-95"><BarChart3 size={12}/> Xem dữ liệu</button>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div className="flex-1 flex flex-col gap-4 overflow-hidden">
                    <div className="bg-white p-6 rounded-[2.5rem] border shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-6 flex-none">
                      <div className="flex flex-col gap-3 overflow-hidden">
                        <h2 className="text-2xl font-black text-indigo-950 uppercase truncate leading-tight tracking-tighter">{viewMode === 'summary' ? 'Hệ thống báo cáo tổng hợp' : selectedUnit}</h2>
                        <div className="flex flex-wrap gap-2">
                          {['B01', 'F01', 'B02'].map(t => (
                            <button key={t} onClick={() => setActiveTab(t)} className={`px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all flex items-center gap-2 border-2 ${activeTab === t ? 'bg-indigo-600 border-indigo-600 text-white shadow-lg' : 'bg-white text-slate-400'}`}>{t}/BCQT</button>
                          ))}
                        </div>
                      </div>
                      <div className="flex gap-3 flex-wrap">
                        {viewMode === 'entry' && (
                          <button onClick={handleSave} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black flex items-center gap-2 shadow-xl hover:bg-indigo-700 transition-all active:scale-95 text-xs uppercase">
                            <Save size={18}/> {saveStatus === 'saving' ? 'ĐANG LƯU...' : 'LƯU DỮ LIỆU'}
                          </button>
                        )}
                      </div>
                    </div>
                    <div className="bg-white rounded-[2.5rem] border shadow-2xl flex-1 overflow-auto custom-scrollbar flex items-center justify-center">
                      <div className="text-center p-10">
                        <FileText size={48} className="text-indigo-200 mx-auto mb-4" />
                        <p className="font-bold text-slate-400 uppercase">Dữ liệu biểu đang được tải hoặc chưa được nhập.</p>
                        <p className="text-[10px] text-slate-300 mt-2 italic uppercase">Vui lòng kiểm tra lại trạng thái kết nối.</p>
                      </div>
                    </div>
                  </div>
                )}
              </main>

              <footer className="bg-slate-900 text-slate-500 p-3 text-center text-[10px] uppercase font-black border-t border-slate-800 flex items-center justify-center gap-4 flex-none">
                 <span>Hệ thống Báo cáo quyết toán - Vụ KHTC 2025</span>
                 <span className="text-indigo-500 tracking-widest">Build K.22.5.12-STABLE</span>
              </footer>

              <style dangerouslySetInnerHTML={{ __html: `
                .sticky { position: sticky; }
                .animate-in { animation: fadeIn 0.4s ease-out forwards; }
                @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
                .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
              `}} />
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Một lệnh ẩn loader dự phòng sau 3 giây nếu React render chậm
        setTimeout(() => {
            const loader = document.getElementById('loading-screen');
            if (loader && loader.style.display !== 'none') {
                console.log("Fallback hiding loader...");
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }
        }, 3000);

    </script>
</body>
</html>
