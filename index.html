                if (firebaseConfig.apiKey !== "demo" && auth) {

                    setLoading(false);
                }

                setLoading(false);
              }

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                  setUser(u);
                  setLoading(false);
                });
                return () => unsubscribe();
            }
